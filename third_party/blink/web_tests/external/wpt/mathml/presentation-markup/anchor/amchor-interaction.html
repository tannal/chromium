<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MathML Anchor Element Hover and URL Target Verification</title>
  <link rel="help" href="https://w3c.github.io/mathml-core/">
  <script src="/resources/testharness.js"></script>
  <script src="/resources/testharnessreport.js"></script>
  <script src="/resources/testdriver.js"></script>
  <script src="/resources/testdriver-vendor.js"></script>

  <style>
    main { margin: 20px; }
    .test-box { margin-bottom: 30px; padding: 10px; border: 1px solid #eee; }
    /* Ensure the elements are large enough for pointer events to reliably target them */
    math, svg { font-size: 24px; min-width: 100px; min-height: 50px; }
  </style>
</head>
<body>

<main>
  <div class="test-box">
    <h3>1. MathML Anchor Test</h3>
    <math id="mathRoot">
      <semantics>
        <mrow>
          <a id="mathmlGammaLink" href="https://en.wikipedia.org/wiki/Gamma_function">
            <mrow><mi mathvariant="normal">Γ</mi><mo stretchy="false">(</mo><mi>t</mi><mo stretchy="false">)</mo></mrow>
          </a>
          <mo>=</mo>
          <a id="mathmlIntegralLink" href="https://en.wikipedia.org/wiki/Gamma_function#Main_definition">
            <mrow>
              <msubsup><mo>∫</mo><mn>0</mn><mrow><mo>+</mo><mo>∞</mo></mrow></msubsup>
              <msup><mi>x</mi><mrow><mi>t</mi><mo>−</mo><mn>1</mn></mrow></msup>
              <msup><mi>e</mi><mrow><mo>−</mo><mi>x</mi></mrow></msup><mi>d</mi><mi>x</mi>
            </mrow>
          </a>
        </mrow>
        <annotation encoding="TeX">\href{...}{\Gamma(t)} = \href{...}{\int dx}</annotation>
      </semantics>
    </math>
  </div>

  <div class="test-box">
    <h3>2. SVG &amp; Nested MathML Anchor Test</h3>
    <svg width="300" height="150" viewBox="0 0 300 150" id="svgRoot">
      <a id="svgModernLink" href="https://www.example.com/modern-svg-href" target="_blank">
        <circle cx="50" cy="50" r="20" fill="#4285F4" />
        <text x="20" y="90" font-family="sans-serif" font-size="12">Modern SVG</text>
      </a>

      <foreignObject x="120" y="10" width="180" height="130">
        <math xmlns="http://www.w3.org/1998/Math/MathML">
          <a id="linkInSVG" href="https://baidu.com">
            <msqrt><mi>n</mi></msqrt>
          </a>
        </math>
      </foreignObject>
    </svg>
  </div>
</main>

<script>
  "use strict";

  // Utility function using standard action sequence to hover over an element
  async function hoverOverElement(element) {
    await test_driver.action_sequence([{
      type: "pointer",
      id: "pointer1",
      parameters: { pointerType: "mouse" },
      actions: [
        { type: "pointerMove", origin: element, x: 0, y: 0, duration: 100 }
      ]
    }]);
  }

  // --------------------------------------------------------------------
  // Test 1: MathML Hover Trigger and Href Target Validation
  // --------------------------------------------------------------------
  promise_test(async (t) => {
    const mathmlLink = document.getElementById('mathmlGammaLink');
    let pointerOverFired = false;

    mathmlLink.addEventListener('pointerover', () => { pointerOverFired = true; }, { once: true });

    await hoverOverElement(mathmlLink);

    assert_true(pointerOverFired, "The 'pointerover' event must be dispatched natively by Blink.");
    assert_true(mathmlLink.matches(':hover'), "MathML anchor must dynamically match the ':hover' pseudo-class.");
    
    const actualHref = mathmlLink.href.animVal || mathmlLink.getAttribute('href');
    assert_equals(actualHref, "https://en.wikipedia.org/wiki/Gamma_function", "Exposed hyperlinking URL is corrupted.");
  }, "Verify that hovering over a MathML anchor fires pointerover and resolves the correct destination URL");

  // --------------------------------------------------------------------
  // Test 2: MathML Complex Math Block Children Hover Transmission
  // --------------------------------------------------------------------
  promise_test(async (t) => {
    const integralLink = document.getElementById('mathmlIntegralLink');

    await hoverOverElement(integralLink);

    // Verify if HitTestResult correctly bubbles up to the parent anchor through multiple layout layers
    assert_true(integralLink.matches(':hover'), "The parent MathML anchor failed to capture the hovered state from deep math tokens.");
  }, "Verify that the underlying HitTestResult bubbles up to the MathMLAnchorElement container when children tokens are targeted");

  // --------------------------------------------------------------------
  // Test 3: SVG Baseline Parity Control Test
  // --------------------------------------------------------------------
  promise_test(async (t) => {
    const svgLink = document.getElementById('svgModernLink');

    await hoverOverElement(svgLink);

    assert_true(svgLink.matches(':hover'), "Standard SVG link anchor failed to acquire ':hover' state.");
    const expectedSvgUrl = svgLink.href.animVal || svgLink.getAttribute('href');
    assert_equals(expectedSvgUrl, "https://www.example.com/modern-svg-href", "SVG absolute hyperlinking routing is broken.");
  }, "Verify SVG anchor baseline behavior for parity checkpoint");

  // --------------------------------------------------------------------
  // Test 4: Mixed Sandbox Environment (MathML inside SVG foreignObject)
  // --------------------------------------------------------------------
  promise_test(async (t) => {
    const linkInSVG = document.getElementById('linkInSVG');

    await hoverOverElement(linkInSVG);

    // Ensure layout and targeting remain robust when mixed-namespace contexts are nested
    assert_true(linkInSVG.matches(':hover'), "MathML anchor nested deep within an SVG foreignObject failed to register hover state.");
    assert_equals(linkInSVG.getAttribute('href'), "https://baidu.com", "Nested mixed-namespace element failed to resolve hyperlinking properties.");
  }, "Verify MathML anchor behavior when isolated inside an SVG foreignObject boundaries");
</script>

</body>
</html>

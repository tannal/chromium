<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>MathML: :link and :visited pseudo-classes on anchor elements</title>
    <link rel="help" href="https://mathml-refresh.github.io/mathml-core/">
    <link rel="match" href="mathml-pseudo-visited-ref.html">
    <style>
        main {
            color: black;
        }
        math a:link {
            color: blue;
        }
        math a:visited {
            color: purple;
        }
    </style>
</head>
<body>
    <main>
        <math xmlns="http://www.w3.org/1998/Math/MathML">
            <a href="nonexistent-random-page-for-test.html">
                <mtext>Unvisited Link</mtext>
            </a>
        </math>

        <math xmlns="http://www.w3.org/1998/Math/MathML">
            <a href="">
                <mtext>Visited Link</mtext>
            </a>
        </math>
    </main>
</body>
</html>

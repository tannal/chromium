<!DOCTYPE html>
<meta charset="utf-8">
<title>MathML Anchor Element Reference Test: Baseline Reference</title>
<style>
    math {
        font-family: "Latin Modern Math", "Cambria Math", monospace;
        font-size: 24px;
    }
    math mi {
        color: -webkit-link;
    }
</style>

<p>The two equations below must render identically, including the link color and underline:</p>

<main>
    <math display="block">
        <mrow>
            <mi>α</mi>
            <mo>+</mo>
            <mi>β</mi>
        </mrow>
    </math>
</main>

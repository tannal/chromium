<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>MathML 'a' element in Canvas: :visited restriction test</title>
<link rel="match" href="canvas-visited-privacy-ref.html">
<link rel="help" href="https://w3c.github.io/mathml-core/#security-considerations">
<style>
  a { color: rgb(0, 0, 255); }
  a:visited { color: rgb(255, 0, 0) !important; }
</style>
</head>
<body>

<canvas id="canvas" width="200" height="50"></canvas>
<script>
  const svgString = `
    <svg xmlns="http://www.w3.org/2000/svg" width="200" height="50">
      <foreignObject width="100%" height="100%">
        <div xmlns="http://www.w3.org/1999/xhtml">
          <math><a href=""><mi>x</mi></a></math>
        </div>
      </foreignObject>
    </svg>
  `;

  const svgBlob = new Blob([svgString], {type: 'image/svg+xml;charset=utf-8'});
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.src = url;

  img.onload = function() {
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(url);
    
    document.documentElement.classList.remove("reftest-wait");
  };
</script>
</body>
<html class="reftest-wait">
</html>

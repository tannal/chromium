<!DOCTYPE html>
<meta charset="utf-8">
<title>Complex MathML Anchor Reference Test: Stirling's Baseline Reference</title>
<style>
  math {
    font-family: "Latin Modern Math", "Cambria Math", monospace;
    font-size: 28px;
    vertical-align: middle;
  }

  math msqrt, math msup {
    color: -webkit-link;
  }
</style>

<p>The complex formula and its hyperlinked parts must render identically below:</p>

<main>
  <math display="block">
    <mrow>
      <mi>n</mi>
      <mo>!</mo>
      <mo>∼</mo>


      <msqrt>
        <mfrac>
          <mrow>
            <mn>2</mn>
            <mi>π</mi>
          </mrow>
          <mi>n</mi>
        </mfrac>
      </msqrt>

      <msup>
        <mrow>
          <mo>(</mo>
          <mfrac>
            <mi>n</mi>
            <mi>e</mi>
          </mfrac>
          <mo>)</mo>
        </mrow>
        <mi>n</mi>
      </msup>
    </mrow>
  </math>
</main>
